services:
    app:
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
        container_name: manufacturing_app
        restart: unless-stopped
        volumes:
            - app_code:/var/www/html
        depends_on:
            - db
        networks:
            - app_network

    nginx:
        image: nginx:stable-alpine
        container_name: manufacturing_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - app_code:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - app_network

    db:
        image: mariadb:11
        container_name: manufacturing_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: manufacturing_test
            MYSQL_USER: manufacturing_user
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: rootsecret
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - db_data:/var/lib/mysql
            - ./database/dataset.sql:/docker-entrypoint-initdb.d/dataset.sql
        networks:
            - app_network

networks:
    app_network:
        driver: bridge

volumes:
    app_code:
    db_data: